spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-s3-writer
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Uploads text content to a fixed S3 bucket under a caller-specified folder (prefix), using the exact file name provided."
  platform: s3
  operation: write

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (prefix) in the S3 bucket to upload into, e.g. the workflow execution id"
    file_name:
      type: string
      required: true
      description: "Exact name of the file to create, e.g. 'summary.md'; reduced to its basename before use"
    contents:
      type: string
      required: true
      description: "Text content to write into the file (UTF-8 encoded, max 1 MB)"

  returns:
    type: object
    description: >
      On success: {status: "SUCCESS", bucket, key ("<folder>/<file_name>"), file_name, folder,
      size_bytes, uploaded_at (UTC YYYYMMDD_HHMMSS)}. An existing object with the same key is overwritten.
      On failure: {status: "FAILED", reason} where reason is one of
      "S3_CLIENT_INIT_FAILED: <detail>", "INVALID_FILE_NAME",
      "FILE_TOO_LARGE: <n> bytes exceeds limit of 1000000",
      "S3_UPLOAD_FAILED (<code>): <message>", "S3_UPLOAD_FAILED: <detail>".
    fields:
      status: {type: string, description: "'SUCCESS' or 'FAILED'"}
      bucket: {type: string, description: "S3 bucket name (present on success)"}
      key: {type: string, description: "Full object key: <folder>/<file_name> (present on success)"}
      file_name: {type: string, description: "File name actually used after basename reduction (present on success)"}
      folder: {type: string, description: "Normalised folder prefix ending in '/' (present on success)"}
      size_bytes: {type: integer, description: "UTF-8 encoded size of contents (present on success)"}
      uploaded_at: {type: string, description: "UTC timestamp YYYYMMDD_HHMMSS taken after the upload (present on success)"}
      reason: {type: string, description: "Failure reason: S3_CLIENT_INIT_FAILED | INVALID_FILE_NAME | FILE_TOO_LARGE | S3_UPLOAD_FAILED (present on failure)"}

credentials:
  source: pod-identity
  access_method: boto3-default-credential-chain
  secret_name: null
  fields_used: []
  iam_actions_required: ["s3:PutObject"]

configuration:
  setup_required: [BUCKET_NAME, AWS_REGION]
  defaults:
    BUCKET_NAME: "<your-s3-bucket-name>"
    AWS_REGION: "us-east-1"
    MAX_FILE_BYTES: 1000000

identity:
  tool_id: "tool-L0-s3-writer-001"
  role: tool-executor

  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]

  permissions:
    operation: write
    platform: s3
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/s3"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "folder_name prefix normalised (leading/trailing slashes stripped, trailing slash re-appended); file_name reduced to basename, empty result rejected with INVALID_FILE_NAME; contents over 1 MB (UTF-8 encoded) rejected with FILE_TOO_LARGE"
  output_sanitization: "boto3 exceptions caught per-stage (client init, upload) and returned as a labelled reason string; ClientError code and message, or raw exception text, may appear in the message"
  logging: "No dedicated log file; errors are returned directly to the caller rather than logged separately"
  credential_handling: "No credentials in code; the pod's IAM role is resolved by boto3 via Pod Identity"
