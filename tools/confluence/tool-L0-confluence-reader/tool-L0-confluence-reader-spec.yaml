spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-confluence-reader
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Reads one Confluence page by its numeric ID via the REST API v1 and returns the page title and body converted from Confluence storage format (XHTML) to Markdown."
  platform: confluence
  operation: read

interface:
  parameters:
    page_id:
      type: string
      required: true
      description: "The numeric ID of the Confluence page, e.g. '425985'"

  returns:
    type: string
    description: >
      On success: "# <page title>\n \n <body as Markdown>". Markdown is always returned; there is no
      option to get raw storage XHTML. Headings, paragraphs, line breaks, bulleted and numbered lists
      (both rendered as "- " bullets, nested lists indented), tables (pipe tables), links, bold, italic,
      inline code and <pre> blocks (fenced, or passed through as-is if they already contain Markdown)
      are converted. Macro "title" parameters become "### <title>" headings; other macro parameters,
      CDATA bodies (code-macro code, plain-text link text), images and script/style are dropped.
      Output longer than 80,000 characters is cut and ends with "_[Truncated.]_".
      Empty page body: "# <title>\n\nurl<base_url>\n\n_(Page <page_id> has an empty body.)_".
      On failure: "Error reading Confluence page: <requests exception>" or
      "Error converting page to Markdown: <ExceptionType>: <detail>".
      At import time, a RuntimeError is raised if the secret cannot be read or is missing keys
      ("Secret '<SECRET_NAME>' is missing keys: [...]").

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [api_key, id, confluence_base_url]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region, secret_key_names]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    max_chars: 80000
    http_timeout_seconds: 30

identity:
  tool_id: "tool-L0-confluence-reader-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: confluence
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/confluence"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "page_id accepted as-is and placed in the request path; no format check. Secret keys checked for presence at import time; base_url trailing slash stripped"
  output_sanitization: "requests exceptions and conversion errors caught and returned as a labelled string; the exception text may include the request URL. The empty-page message includes the Confluence base URL"
  logging: "No dedicated log file; errors are returned directly to the caller rather than logged separately"
  credential_handling: "Email (secret key 'id') and API token (secret key 'api_key') read from AWS Secrets Manager via Pod Identity at import time and sent as HTTP Basic Auth; never returned or logged"
