spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-jira-linked-issue-writer
  version: "1.1.0"
  layer: L0
  owner: agentic-ai-coe
purpose:
  description: "Creates one or more Jira issues of the issue type given in the payload, converting markdown-style descriptions to ADF, linking logical IDs (e.g. E1) to the keys of issues created earlier in the same call, and linking each created issue to a source issue by SourceIssueId so it appears under Related issues."
  platform: jira
  operation: write
interface:
  parameters:
    inputJSON:
      type: object
      required: true
      description: >
        Dictionary with the following fields:
          projectKey     (string, required in practice) - Jira project key; no fallback in code.
          issueType      (string, required unless set on every issue) - issue type name for all issues, built-in or custom; no default in code.
          SourceIssueId  (string, required unless set on every issue) - real Jira key of the issue each created issue is linked to; no default in code; key name is case-sensitive.
          linkType       (string, optional, default 'Relates') - Jira issue link type name used for the link.
          baseUrl        (string, optional) - overrides base_url from the secret.
          userEmail      (string, optional) - overrides id from the secret.
          issues         (array, optional, default []) - issues created in order, each with:
            summary        (string, required)
            description    (string | object, required) - string with '- ' bullets, **bold**, *italic*; an object is rendered as headed sections.
            issueType      (string, optional) - overrides the top-level issue type.
            SourceIssueId  (string, optional) - overrides the top-level source issue key.
            label          (array[string], optional) - sent as Jira labels; label[0] is the logical ID used for cross-linking.
        No parent field is sent, so sub-task issue types are not supported. An apiToken field is not read; the token always comes from the secret (or JIRA_API_TOKEN env var).
        The payload must be passed as inputJSON itself; a nested {"inputJSON": {...}} wrapper results in an empty string.
  returns:
    type: string
    description: >
      Newline-joined lines, one per issue, in input order:
      "<issueType> created: <KEY> | Linked to <SourceIssueId> (<linkType>)",
      "<issueType> created: <KEY> | Link to <SourceIssueId> failed → HTTP <status> | Detail: <response body>",
      "Failed: <summary> → HTTP <status> | Detail: <response body>",
      "Failed: <summary> → no issueType supplied in payload", "Failed: <summary> → no SourceIssueId supplied in payload"
      or "Failed: <summary> → <exception> | Detail: <response body | No response received>".
      An empty string when 'issues' is empty. Any other exception (e.g. missing summary or description)
      returns a single "Fatal error: <detail>" and discards the result lines collected so far.
credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [base_url, id, api_key]
configuration:
  setup_required: [SECRET_NAME, secrets-manager region_name]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets-manager region_name: "us-east-2"
    DEFAULT_LINK_TYPE: "Relates"
identity:
  tool_id: "tool-L0-jira-linked-issue-writer-001"
  role: tool-executor
  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]
  permissions:
    operation: write
    platform: jira
    scope: "project-level"
  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/jira"
resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}
security:
  input_validation: "Pydantic requires inputJSON to be a dict; issueType and SourceIssueId must resolve per issue or that issue is skipped with a Failed line; summary/description presence is only enforced by the KeyError that ends the run"
  output_sanitization: "Jira HTTP status and raw response body returned on per-issue create or link failure; other exceptions returned as a 'Fatal error' string with the exception text"
  logging: "Prints the HTTP status and full Jira response body to stdout for every create and link call; credentials are not printed"
  credential_handling: "Jira base URL, account email and API token read once at module import from AWS Secrets Manager via Pod Identity; caller may override baseUrl and userEmail but not the token"
