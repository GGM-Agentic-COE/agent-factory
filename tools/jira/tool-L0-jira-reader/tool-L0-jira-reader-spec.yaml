spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-jira-reader
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Fetches one or more Jira issues with their nested child hierarchy (up to a configurable depth) and returns a clean, fixed-schema JSON string."
  platform: jira
  operation: read

interface:
  parameters:
    inputJSON:
      type: object
      required: true
      description: >
        Dictionary with the following fields:
          key             (string)          - single Jira issue key, e.g. 'PROJ-101'. Required if 'keys' is not given.
          keys            (array[string])   - several Jira issue keys. Takes precedence over 'key'; a string value is treated as one key.
          maxDepth        (integer, optional, default 5) - levels of children to walk; 0 or empty falls back to 5.
          includeChildren (boolean, optional, default true) - set false to return only the requested issues.
          baseUrl         (string, optional) - overrides base_url from the secret.
          userEmail       (string, optional) - overrides id from the secret.
          apiToken        (string, optional) - overrides api_key from the secret (then JIRA_API_TOKEN env var).
        Input is coerced before validation: a list becomes {"keys": [...]}, a JSON string is parsed,
        a comma-separated string becomes 'keys', and any other string becomes 'key'.

  returns:
    type: string
    description: >
      On success: pretty-printed JSON. A single object when one 'key' is requested, otherwise an array.
      Each node has issue_id, title, status, description (ADF converted to plain text), labels,
      assignee, due_date, reporter, child_work_item_ids and children (same shape, recursive).
      An issue that cannot be fetched appears as {"issue_id": <key>, "error": "HTTP <status>", "detail": <response body>}.
      On failure: "Fatal error: provide 'key' (string) or 'keys' (list).", "Fatal error (network): <detail>"
      or "Fatal error: <detail>".

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [base_url, id, api_key]

configuration:
  setup_required: [SECRET_NAME, secrets-manager region_name]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets-manager region_name: "us-east-1"
    DEFAULT_MAX_DEPTH: 5
    PAGE_SIZE: 100

identity:
  tool_id: "tool-L0-jira-reader-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: jira
    scope: "project-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/jira"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "inputJSON coerced to a dict by a Pydantic before-validator; presence of key/keys checked before any API call; key values are not format-checked"
  output_sanitization: "Per-issue HTTP errors returned as issue_id/error/detail objects including the raw Jira response body; exceptions returned as a 'Fatal error' string with the exception text"
  logging: "Prints 'GET <key> -> <status>' to stdout for each top-level issue; credentials are not printed"
  credential_handling: "Jira base URL, account email and API token read once at module import from AWS Secrets Manager via Pod Identity; caller may override them through baseUrl/userEmail/apiToken in inputJSON"
