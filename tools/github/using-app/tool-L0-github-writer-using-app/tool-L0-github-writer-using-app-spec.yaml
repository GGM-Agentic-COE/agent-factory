spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-github-writer-using-app
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Creates a branch from a source branch (or reuses it if it already exists) and commits one or more text files to it in a single commit, authenticating as a GitHub App installation."
  platform: github
  operation: write

interface:
  parameters:
    files:
      type: array
      required: true
      description: >
        List of file objects. Each item is either flat {"filename": "<path>", "code": "<content>"}
        or nested {"<folder>": {"filename": "<name>", "code": "<content>"}} (exactly one key whose
        value contains "filename"); the nested form commits to "<folder>/<name>". Both forms can be
        mixed. A missing filename defaults to "script.py" and missing code to "". Leading "/" is
        stripped from filename and surrounding "/" from folder. A dict (instead of a list) is not accepted.
      items:
        type: object
    repo_name:
      type: string
      required: true
      description: "Repository name, either bare ('my-project-repo') or fully qualified ('<owner>/<repo>'). A bare name is resolved to its owner through the App's installations"
    new_branch:
      type: string
      required: true
      description: "Branch to create from source_branch and commit to (e.g. 'feature/auto-update'). If it already exists, the commit is added on top of its current head"
    source_branch:
      type: string
      required: false
      default: "main"
      description: "Branch to copy when creating new_branch"

  returns:
    type: object
    description: >
      On success: {status: "success", branch, source_branch, updated_files (list of committed paths),
      message: "Created '<new_branch>' from '<source_branch>' and committed <n> file(s).",
      url: "https://github.com/<owner>/<repo>/tree/<new_branch>"}.
      On failure: {status: "failure", message}. message is the App/owner resolution error text,
      "<HTTP error> | GitHub response: <status> <body>" for HTTP errors (403 adds a HINT about the
      App's Contents permission being Read-only), or the raw exception text otherwise.

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [app_id, client_id, private_key]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    GITHUB_API: "https://api.github.com"
    JWT_TTL_SECONDS: 480
    JWT_REFRESH_MARGIN: 60
    TOKEN_REFRESH_MARGIN: 300
    REQUEST_TIMEOUT: 30
    commit_message: "Automation Update: <YYYY-MM-DD HH:MM:SS local time>"
    file_mode: "100644"

identity:
  tool_id: "tool-L0-github-writer-using-app-001"
  role: tool-executor

  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]

  permissions:
    operation: write
    platform: github
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/github-app"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "Types checked by the Pydantic schema only; file paths and content are not otherwise validated. An HTTP 422 on branch creation is treated as 'branch already exists' and the commit is stacked on that branch's head"
  output_sanitization: "All exceptions caught and returned as {status: failure, message}; HTTP errors include GitHub's status code and raw response body, 403 adds a permission hint; no stack traces returned"
  logging: "No logging; results are returned directly to the caller. JWT and installation tokens are never returned or printed"
  credential_handling: "GitHub App ID / Client ID and private key read once at import from AWS Secrets Manager via Pod Identity; a JWT (RS256, 480 s) is cached in memory and exchanged for an installation token cached per installation for up to ~55 minutes"
