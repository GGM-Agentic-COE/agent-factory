spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-github-reader-using-app
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Recursively reads and returns the decoded text contents of every file under a folder of a GitHub repository branch, authenticating as a GitHub App installation."
  platform: github
  operation: read

interface:
  parameters:
    folder_location:
      type: string
      required: true
      description: "Folder path inside the repository to read recursively (e.g. 'lld' or 'project_k/lld'). Must be non-empty; surrounding whitespace and leading/trailing slashes are stripped"
    repo:
      type: string
      required: true
      description: "Repository name, either bare ('my-project-repo') or fully qualified ('<owner>/<repo>'). A bare name is resolved to its owner through the App's installations"
    branch:
      type: string
      required: true
      description: "Exact branch name to read from (e.g. 'main', 'develop', 'feature/my-feature')"

  returns:
    type: object
    description: >
      On success: a dict {repository: "<owner>/<repo>", branch, folder_location (normalised), files}.
      files is keyed by file path; each value has status success (content, size, sha),
      binary_or_non_utf8 (message "File is not UTF-8 text; content not decoded.", size, sha),
      not_found (message "File '<path>' not found in branch '<branch>'."), or
      error (message "Failed to decode file content: <error>" or "Unsupported type: <type>").
      An optional message key carries "No files found under folder '<folder>'." (files is then {})
      or "Warning: GitHub truncated the repository tree; the file list may be incomplete."
      On failure: a string — "Error reading scripts: <detail>" (empty folder_location, App/owner
      resolution failures, folder not found in branch, tree SHA not resolved, HTTP/network errors
      with " | GitHub response: <status> <body>" appended) or "Error: Repository '<owner>/<repo>' not found."

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [app_id, client_id, private_key]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    GITHUB_API: "https://api.github.com"
    JWT_TTL_SECONDS: 480
    JWT_REFRESH_MARGIN: 60
    TOKEN_REFRESH_MARGIN: 300
    REQUEST_TIMEOUT: 30

identity:
  tool_id: "tool-L0-github-reader-using-app-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: github
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/github-app"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "folder_location must be a non-empty string and is stripped of whitespace and slashes; repo is stripped of whitespace and slashes; branch is passed as-is (URL-encoded in the branch lookup)"
  output_sanitization: "requests exceptions and other errors caught and returned as an 'Error reading scripts: ...' string; HTTP errors include GitHub's status code and raw response body; no stack traces returned"
  logging: "No logging; errors are returned directly to the caller. JWT and installation tokens are never returned or printed"
  credential_handling: "GitHub App ID / Client ID and private key read once at import from AWS Secrets Manager via Pod Identity; a JWT (RS256, 480 s) is cached in memory and exchanged for an installation token cached per installation for up to ~55 minutes"
