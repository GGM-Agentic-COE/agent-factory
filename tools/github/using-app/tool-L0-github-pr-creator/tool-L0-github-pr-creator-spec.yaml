spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-github-pr-creator
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Opens a pull request from a source branch into a destination branch with a runtime-supplied title, authenticating as a GitHub App installation. Returns an already-open pull request for the same branch pair instead of creating a duplicate."
  platform: github
  operation: write

interface:
  parameters:
    repo_name:
      type: string
      required: true
      description: "Repository name, either bare ('my-project-repo') or fully qualified ('<owner>/<repo>'). A bare name is resolved to its owner through the App's installations"
    source_branch:
      type: string
      required: true
      description: "Branch that contains the changes (the pull request 'head'), e.g. 'feature/auto-update'. Must exist in the same repository. Surrounding whitespace is stripped"
    pull_request_title:
      type: string
      required: true
      description: "Pull request title. Surrounding whitespace is stripped; an empty or whitespace-only title is rejected. No body is set"
    destination_branch:
      type: string
      required: false
      default: "main"
      description: "Branch the changes should be merged into (the pull request 'base'). Must exist and differ from source_branch"

  returns:
    type: object
    description: >
      On creation: {status: "success", already_existed: false, pull_request_number, pull_request_title,
      source_branch, destination_branch, commits (ahead_by from the compare), files_changed (number of files
      in the compare response), message: "Opened pull request #<n> from '<source>' into '<destination>' in
      '<owner>/<repo>'.", url (the pull request's html_url)}.
      When an open pull request already exists for the same pair: {status: "success", already_existed: true,
      pull_request_number, pull_request_title (the existing PR's title), source_branch, destination_branch,
      message: "An open pull request #<n> already exists from '<source>' into '<destination>'.", url}.
      On failure: {status: "failure", message}. message is one of the input validation texts
      ("Both source_branch and destination_branch are required.", "A non-empty pull request title is required.",
      "Source and destination branch are the same ('<branch>')."), the App/owner resolution error text,
      "<Source|Destination> branch '<branch>' does not exist in '<owner>/<repo>'.",
      "No commits to merge: '<source>' has no changes that '<destination>' does not already contain.",
      "GitHub rejected the pull request: <GitHub message (details)>" for a 422 on creation,
      "<HTTP error> | GitHub response: <status> <GitHub message>" for other HTTP errors (403 adds a HINT about
      the 'Pull requests: Read and write' permission, 404 adds a HINT about repository access and the
      'Contents' / 'Pull requests' permissions), or the raw exception text otherwise.

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [app_id, client_id, private_key]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    GITHUB_API: "https://api.github.com"
    JWT_TTL_SECONDS: 480
    JWT_REFRESH_MARGIN: 60
    TOKEN_REFRESH_MARGIN: 300
    REQUEST_TIMEOUT: 30

identity:
  tool_id: "tool-L0-github-pr-creator-001"
  role: tool-executor

  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]

  permissions:
    operation: write
    platform: github
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/github-app"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "Types checked by the Pydantic schema; branches and title are stripped and rejected when empty, and identical source/destination branches are rejected. Both branches are checked to exist and the source must be ahead of the destination before a pull request is created"
  output_sanitization: "All exceptions caught and returned as {status: failure, message}; HTTP errors include GitHub's status code and its error message, 403 and 404 add a permission hint; no stack traces returned"
  logging: "No logging; results are returned directly to the caller. JWT and installation tokens are never returned or printed"
  credential_handling: "GitHub App ID / Client ID and private key read once at import from AWS Secrets Manager via Pod Identity; a JWT (RS256, 480 s) is cached in memory and exchanged for an installation token cached per installation for up to ~55 minutes"
