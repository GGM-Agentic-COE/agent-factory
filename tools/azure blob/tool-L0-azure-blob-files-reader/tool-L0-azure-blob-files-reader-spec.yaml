spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-azure-blob-files-reader
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Reads and returns the contents of specific named files inside a given folder (blob prefix) of a fixed Azure Blob Storage container."
  platform: azure-blob
  operation: read

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (blob prefix) in the configured Azure Blob Storage container that contains the files to be read"
    file_names:
      type: array
      items: string
      required: true
      description: >
        List of file names inside the folder to read, e.g. ['file-1.md', 'file-2.md'].
        Also accepts a JSON array string or a comma-separated string; surrounding quotes
        and empty entries are removed. Only these files are read.

  returns:
    type: string
    description: >
      On success: "Read <n> of <m> requested file(s) from folder '<folder_name>':" followed by one
      "===== FILE: <blob path> =====" section per requested file (in request order, duplicates removed),
      each with the decoded UTF-8 content, or one of [File not found in folder],
      [Error reading this file], [Binary content, <n> bytes — not displayed as text];
      optionally followed by "Files not found: <paths>" and "Files that failed to download: <paths>".
      Informational strings: "No file names were provided. Provide at least one file name to read.",
      "Container '<container_name>' does not exist.",
      "None of the requested files were readable in folder '<folder_name>'. Requested: <names>."
      On any other failure: "An error occurred while reading the folder" (details in azure_blob_operations.log).

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [azure_connection_string]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region, container_name]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    container_name: "<your-azure-container-name>"
    log_file: "azure_blob_operations.log"

identity:
  tool_id: "tool-L0-azure-blob-files-reader-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: azure-blob
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/azure-blob"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "file_names coerced from list, JSON string or comma-separated string, quotes stripped, empties dropped, duplicates skipped; leading '/' stripped from each name; names already starting with the folder prefix are used as-is; folder_name trailing slashes normalised to one"
  output_sanitization: "Azure SDK exceptions caught and logged; a generic error string is returned to the caller; per-file failures are shown as [Error reading this file]"
  logging: "Operations logged to azure_blob_operations.log (working directory) at INFO/ERROR level with stack traces; file sections are also printed to stdout; connection string never logged"
  credential_handling: "Connection string read from AWS Secrets Manager (key azure_connection_string) via Pod Identity at module import; nothing stored in code"
