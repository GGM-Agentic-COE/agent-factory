spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-azure-blob-writer
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Creates a virtual folder and uploads a text file with the given content to a fixed Azure Blob Storage container, creating the container if it does not exist."
  platform: azure-blob
  operation: write

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (blob prefix) to create in the container; used as-is"
    file_name:
      type: string
      required: true
      description: "Name of the file to create in the folder, including the extension (e.g. 'document.txt'); sanitised before upload"
    content:
      type: string
      required: true
      description: "Text content to write to the file (plain text, JSON, CSV, Markdown); truncated if larger than 10 MB"

  returns:
    type: string
    description: >
      On success: three lines —
      "Container '<container_name>' created successfully. blob_storage_url = '<blob_storage_url>'"
      (or "... already exists. blob_storage_url = '<blob_storage_url>'"),
      "Folder '<folder_name>' created successfully.",
      "File '<file_name>' created successfully in folder '<folder_name>'."
      Existing blobs with the same path are overwritten.
      On failure: one of "Error accessing container. Please try again later or contact support.",
      "Error creating folder. Please try again later or contact support.",
      "Error creating file. Please try again later or contact support.",
      "An error occurred while processing your request. Please try again later or contact support."
      (details in azure_blob_operations.log).

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [azure_connection_string]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region, container_name, blob_storage_url]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    container_name: "<your-azure-container-name>"
    blob_storage_url: "<your-storage-account>.blob.core.windows.net/<your-azure-container-name>"
    max_content_size: 10485760
    log_file: "azure_blob_operations.log"

identity:
  tool_id: "tool-L0-azure-blob-writer-001"
  role: tool-executor

  invocable_by:
    roles: [orchestrator]
    agents: [any-agent-with-write-permission]

  permissions:
    operation: write
    platform: azure-blob
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/azure-blob"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "file_name sanitised (\\ / * ? : \" < > | and '..' replaced with '_', leading dots/slashes stripped, empty becomes 'default'); content coerced to string and truncated to 10 MB; folder_name accepted as-is (not sanitised)"
  output_sanitization: "Azure SDK exceptions caught and logged; generic error strings returned to the caller — no stack traces exposed"
  logging: "Operations and sanitisation warnings logged to azure_blob_operations.log (working directory) with stack traces on error; connection string never logged"
  credential_handling: "Connection string read from AWS Secrets Manager (key azure_connection_string) via Pod Identity at module import; nothing stored in code"
