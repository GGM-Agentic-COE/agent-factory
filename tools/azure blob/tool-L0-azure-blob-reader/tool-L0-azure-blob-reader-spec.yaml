spec_version: "1.0"
artifact_type: tool
metadata:
  name: tool-L0-azure-blob-reader
  version: "2.0.0"
  layer: L0
  owner: agentic-ai-coe

purpose:
  description: "Reads and returns the contents of every file inside a given folder (blob prefix) of a fixed Azure Blob Storage container."
  platform: azure-blob
  operation: read

interface:
  parameters:
    folder_name:
      type: string
      required: true
      description: "Name of the folder (blob prefix) in the configured Azure Blob Storage container whose files should be read"

  returns:
    type: string
    description: >
      On success: "Read <n> file(s) from folder '<folder_name>':" followed by one
      "===== FILE: <blob name> =====" section per blob (recursive, in the order the
      service lists them), each with the decoded UTF-8 content, or one of
      [Binary content, <n> bytes — not displayed as text], [Error reading this file].
      Informational strings: "Container '<container_name>' does not exist.",
      "No files found in folder '<folder_name>'.",
      "Folder '<folder_name>' contains no readable files (only the folder marker)."
      On any other failure: "An error occurred while reading the folder" (details in azure_blob_operations.log).

credentials:
  source: aws-secrets-manager
  secret_name: "<name-of-secret-in-aws-secrets-manager>"
  access_method: pod-identity
  fields_used: [azure_connection_string]

configuration:
  setup_required: [SECRET_NAME, secrets_manager_region, container_name]
  defaults:
    SECRET_NAME: "<name-of-secret-in-aws-secrets-manager>"
    secrets_manager_region: "us-east-1"
    container_name: "<your-azure-container-name>"
    log_file: "azure_blob_operations.log"

identity:
  tool_id: "tool-L0-azure-blob-reader-001"
  role: tool-executor

  invocable_by:
    roles: [content-generator, orchestrator]
    agents: [any-agent-with-read-permission]

  permissions:
    operation: read
    platform: azure-blob
    scope: "org-level"

  credential_scoping:
    method: org-from-context
    vault_path_template: "/secrets/{org_id}/azure-blob"

resilience:
  timeout_seconds: 30
  retry: {max: 2, backoff: exponential, retry_on: [timeout, 429, 502, 503]}
  circuit_breaker: {failure_threshold: 5, reset_seconds: 60}

security:
  input_validation: "folder_name accepted as-is; trailing slashes stripped and a single trailing slash appended; an empty value becomes an empty prefix (whole container)"
  output_sanitization: "Azure SDK exceptions caught and logged; a generic error string is returned to the caller; per-file download errors are shown as [Error reading this file]"
  logging: "Operations logged to azure_blob_operations.log (working directory) at INFO/ERROR level with stack traces; file sections are also printed to stdout; connection string never logged"
  credential_handling: "Connection string read from AWS Secrets Manager (key azure_connection_string) via Pod Identity at module import; nothing stored in code"
