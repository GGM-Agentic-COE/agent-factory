# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-statement-generator-evaluator
  version: "2.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"
  updated: "2026-10-05"

purpose:
  description: "Independently verifies that L1-vision-statement-generator's reconciliation is real — every Amber/Red regulatory constraint is covered by open_risks, executive_summary introduces no new claims, and the viability_score it received (owned by L1-vision-regulatory-feasibility-checker and re-derived at qg-L1-viability-score during that agent's evaluator run) is reported honestly, not silently overridden."
  input: "L1-vision-statement-generator's original input (the upstream item sets and the viability_score) plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "This is the last automated checkpoint before a human (the Product Lead) reads the vision document. If a serious regulatory finding was dropped anywhere in the pipeline, this is the last place it can still be caught before it reaches a person who will reasonably assume nothing was silently lost."

prompt:
  ref: "prompts/L1-vision-statement-generator-evaluator/instructions.md"
  version: "2.0.0"
  description: "Scores against L1-vision-statement-generator/evaluation.md; the reconciliation coverage check is the primary gate, not one check among many."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-statement-generator]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The upstream item sets, the viability_score and the product_name (if the user supplied one) that L1-vision-statement-generator received" }
      generator_output: { type: object, description: "L1-vision-statement-generator's draft items output, including items.product_name and the Confluence page (title, page_id, URL) in its artifact storage" }
      # GitHub reference material — nothing defaulted or inferred. A rubric read from the
      # wrong path silently changes the bar at the last checkpoint before a human reads the vision page.
      reference_repo: { type: string, description: "Repository holding the rubric and examples — bare name or 'owner/repo'. Read with tool-L1-github-reader-using-app" }
      reference_branch: { type: string, description: "Branch to read the reference material from (e.g. 'main')" }
      evaluation_rubric_kb_folder: { type: string, description: "Repo folder holding L1-vision-statement-generator's evaluation.md rubric content. Unavailable → REFERENCE_UNAVAILABLE: a gate that invented its own bar is worse than no gate" }
    optional_parameters:
      examples_folder: { type: string, default: null, description: "Repo folder holding this evaluator's worked input/output examples (greenfield/agents/L1-vision-statement-generator-evaluator/examples in this repository). Shape guidance only — never a source of findings, numbers or verdicts. Unavailable is tolerated" }

  output:
    $ref: "output_schema.json"

context:
  # No KB is attached at runtime. The rubric (L1-vision-statement-generator/evaluation.md)
  # and this evaluator's examples are READ FROM GITHUB with tool-L1-github-reader-using-app,
  # from evaluation_rubric_kb_folder and examples_folder — the repository is the single
  # source of truth, so no runtime copy can drift from it.
  knowledge_bases: []
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-consistency-check   # re-checked independently — the reconciliation coverage check
    - gr-L1-vision-statement-quality-gate   # fires when THIS evaluator concludes; validates L1-vision-statement-generator's RESULTANT output against its own schema+evaluation.md, above all the reconciliation-coverage BLOCKER (guardrails/gr-L1-vision-statement-quality-gate)
  tools:
    - tool-L1-github-reader-using-app  # reads the rubric and the examples folder from GitHub — one call per folder, repo/branch/paths all from the request
    - tool-L1-azure-blob-reader      # reads regulatory-feasibility.md, idea-brief.json and market-analysis.md in one call — the vision document is no longer in blob
    - tool-L1-confluence-reader      # reads the vision page the generator wrote — space_key 514162689 (fixed in the prompt), page picked by title "<product_name>-vision.md"
    - tool-L1-confluence-writer      # rewrites the vision page ONLY when a fix changes its content — title, full corrected XHTML content, space_key 514162689. Replaces the blob writer

quality:
  evaluation_ref: "evaluation.md"
  min_score: 8.5   # matches the regulatory-checker-evaluator's bar — this is also a last-line-of-defense agent
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
