# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L1-vision-statement-generator-evaluator
  version: "2.0.0"
  layer: L1
  phase: vision
  owner: agentic-ai-coe
  created: "2026-08-02"
  updated: "2026-10-05"

purpose:
  description: "Independently verifies that L1-vision-statement-generator's reconciliation is real — every Amber/Red regulatory constraint is covered by open_risks, executive_summary introduces no new claims, and the viability_score it received (owned by L1-vision-regulatory-feasibility-checker and re-derived at qg-L1-viability-score during that agent's evaluator run) is reported honestly, not silently overridden."
  input: "L1-vision-statement-generator's original input (the upstream item sets and the viability_score) plus its draft output."
  output: "Scores, findings, any fixes applied, and a final decision."
  business_value: "This is the last automated checkpoint before a human (the Product Lead) reads the vision document. If a serious regulatory finding was dropped anywhere in the pipeline, this is the last place it can still be caught before it reaches a person who will reasonably assume nothing was silently lost."

prompt:
  ref: "prompts/L1-vision-statement-generator-evaluator/instructions.md"
  version: "2.0.0"
  description: "Scores against L1-vision-statement-generator/evaluation.md; the reconciliation coverage check is the primary gate, not one check among many."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L1-vision-statement-generator]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      folder_name: { type: string, description: "Blob storage folder holding vision.md, regulatory-feasibility.md, idea-brief.json and (optionally) market-analysis.md" }
      # No agent output is passed in. vision.md is read from blob storage (folder_name),
      # items are built from it, and the evaluated document is published to Confluence.
      # The rubric is NOT a request parameter. It is read from GitHub with fixed values in the prompt:
      #   repo agentic-sdlc-knowledge-bases, branch main,
      #   folder planning/vision-statement-generator/L1-vision-statement-generator (file evaluation.md).

  output:
    $ref: "output_schema.json"

context:
  # No KB is attached at runtime. The rubric (L1-vision-statement-generator/evaluation.md)
  # is READ FROM GITHUB with tool-L1-github-reader-using-app at the fixed location above.
  knowledge_bases: []
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L1-consistency-check   # re-checked independently — the reconciliation coverage check
    - gr-L1-vision-statement-quality-gate   # fires when THIS evaluator concludes; validates L1-vision-statement-generator's RESULTANT output against its own schema+evaluation.md, above all the reconciliation-coverage BLOCKER (guardrails/gr-L1-vision-statement-quality-gate)
  tools:
    - tool-L1-github-reader-using-app  # reads the rubric (evaluation.md) ONLY — repo agentic-sdlc-knowledge-bases, branch main, fixed folder; one call
    - tool-L1-azure-blob-reader      # reads vision.md, regulatory-feasibility.md, idea-brief.json and market-analysis.md in one call
    - tool-L1-confluence-writer      # publishes the evaluated (corrected) vision document — title "<product_name>-vision.md", XHTML content, space_key 514162689. Always, including escalate_to_hitl — the human reviews it in Confluence. The ONLY write: nothing goes back to blob

quality:
  evaluation_ref: "evaluation.md"
  min_score: 8.5   # matches the regulatory-checker-evaluator's bar — this is also a last-line-of-defense agent
  hallucination_check: true
  consistency_check: true

performance:
  target_latency_seconds: 15
  max_token_budget: 6000

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
