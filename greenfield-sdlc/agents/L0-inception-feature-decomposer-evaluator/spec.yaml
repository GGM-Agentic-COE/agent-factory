    parent Epics.
  input: Feature Decomposer AgentOutput and approved Epic Evaluator AgentOutput from
    the same workflow.
  output: AgentOutput content.type=feature_evaluation
  business_value: Prevents broken Feature-to-Epic lineage, unsupported corrections,
    and invalid downstream handoff.
