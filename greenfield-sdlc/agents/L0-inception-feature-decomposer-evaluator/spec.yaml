    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats:
      - .md
      - .txt
      - .json
    required_parameters:
      workflow_context:
        type: object
        description: Source content and workflow lineage required by the prompt.
    optional_parameters: {}
  output:
    $ref: output_schema.json
