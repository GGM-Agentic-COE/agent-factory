# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-nfr-classifier-evaluator
  version: "1.0.0"
  layer: L0
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-10-26"

purpose:
  description: "Independently re-derives L0-nfr-classifier's NFR classification — category coverage, citation integrity and TBD resolvability — fixes grounded gaps in the JSON, and emits the corrected NFR set with scores and a final decision."
  input: "L0-nfr-classifier's output (nfr_classifications[]) plus its original input (evaluated requirements and regulatory feasibility analysis)."
  output: "The corrected nfr_classifications[] in the same structure the classifier emits, plus an evaluation block (scores, findings, fixes_applied with before/after and reasoning, final_decision)."
  business_value: "A TBD left open when a real source already answers it, or a number cited to a source that doesn't support it, flows straight into the PRD. This evaluator catches both, and its corrected JSON — not the raw classifier output — is what L0-prd-composer builds on."

prompt:
  ref: "agents/L0-nfr-classifier-evaluator/L0-nfr-classifier-evaluator-prompt.md"
  version: "1.0.0"
  description: "Re-asks every taxonomy category per FR, verifies each cited source actually supports its boundary condition, checks each TBD against regulatory feasibility, fixes grounded gaps, and escalates anything needing new stakeholder input."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L0-nfr-classifier]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The input L0-nfr-classifier received — requirements_output and regulatory_feasibility_output, used for independent re-derivation" }
      generator_output: { type: object, description: "L0-nfr-classifier's JSON output (nfr_classifications[])" }
      github-nfr-evaluator-folder-location: { type: string, description: "GitHub folder holding the classifier's evaluation file" }
      github-nfr-evaluator-repo-name: { type: string, description: "GitHub repository holding the classifier's evaluation file" }
      github-nfr-evaluator-branch: { type: string, description: "GitHub branch holding the classifier's evaluation file" }
      github-nfr-classifier-kb-folder-location: { type: string, description: "GitHub folder holding kb-L0-nfr-classification-taxonomy" }
      github-nfr-classifier-kb-repo-name: { type: string, description: "GitHub repository holding kb-L0-nfr-classification-taxonomy" }
      github-nfr-classifier-kb-branch: { type: string, description: "GitHub branch holding kb-L0-nfr-classification-taxonomy" }

  output:
    $ref: "output_schema.json"   # content.type: "nfr_classification" + evaluation block — schema file not yet created

context:
  knowledge_bases:
    - ref: "../L0-nfr-classifier/evaluation.md"   # source of truth for scoring, retrieved from GitHub at runtime — never duplicated in this agent's prompt
    - kb-L0-nfr-classification-taxonomy         # used to independently re-ask each category's question per FR
  guardrails:
    - gr-L0-output-schema-validator
    - gr-L0-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator      # re-checked independently, not by trusting the classifier's own pass/fail claim
    - gr-L3-consistency-checker
    - gr-L1-tool-permissions
    - gr-L3-agent-rate-limit
  tools:
    - tool-L0-github-reader-using-PAT    # reads the evaluation file and the taxonomy KB; tool-L0-github-reader-using-app takes the same parameters if that variant is deployed instead
    # read-only — all corrections live in the JSON output; nothing is written to any external store

quality:
  evaluation_ref: "evaluation.md"   # THIS evaluator's own meta-quality bar, not the classifier's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong classification
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
