# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-requirements-elicitor-evaluator
  version: "1.0.0"
  layer: L0
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-10-26"

purpose:
  description: "Independently verifies L0-requirements-elicitor's requirements are Complete, Verifiable and Consistent, fixes grounded gaps directly in the JSON, and emits the corrected requirement set with scores and a final decision."
  input: "L0-requirements-elicitor's output (functional_requirements[], compound_splits[]) plus the original vision input for independent coverage re-derivation."
  output: "The corrected requirement set in the same structure the elicitor emits, plus an evaluation block (scores, findings, fixes_applied with before/after and reasoning, final_decision)."
  business_value: "The elicitor's self-check only covers Singular and Unambiguous. This evaluator covers the remaining ISO/IEC/IEEE 29148 characteristics, and its corrected JSON, not the raw elicitor output, is what the NFR classifier and PRD composer build on."

prompt:
  ref: "agents/L0-requirements-elicitor-evaluator/L0-requirements-elicitor-evaluator-prompt.md"
  version: "1.0.0"
  description: "Re-derives coverage by set membership against vision.md, checks every FR is verifiable and consistent, spot-checks the elicitor's mechanical self-check, fixes grounded gaps, and escalates anything needing new scope judgment."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L0-requirements-elicitor]
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      original_input: { type: object, description: "The input L0-requirements-elicitor received, including vision_output — needed for the full vision.md sections used in the coverage check" }
      generator_output: { type: object, description: "L0-requirements-elicitor's JSON output (functional_requirements[], compound_splits[])" }
      github-requirements-evaluator-folder-location: { type: string, description: "GitHub folder holding the elicitor's evaluation file" }
      github-requirements-evaluator-repo-name: { type: string, description: "GitHub repository holding the elicitor's evaluation file" }
      github-requirements-evaluator-branch: { type: string, description: "GitHub branch holding the elicitor's evaluation file" }
      github-requirements-elicitor-kb-folder-location: { type: string, description: "GitHub folder holding kb-L0-requirements-quality-standard" }
      github-requirements-elicitor-kb-repo-name: { type: string, description: "GitHub repository holding kb-L0-requirements-quality-standard" }
      github-requirements-elicitor-kb-branch: { type: string, description: "GitHub branch holding kb-L0-requirements-quality-standard" }

  output:
    $ref: "output_schema.json"   # content.type: "requirements" + evaluation block — schema file not yet created

context:
  knowledge_bases:
    - ref: "../L0-requirements-elicitor/evaluation.md"   # source of truth for scoring, retrieved from GitHub at runtime — never duplicated in this agent's prompt
    - kb-L0-requirements-quality-standard               # full ISO/IEC/IEEE 29148 characteristics (Complete, Verifiable, Consistent, Feasible, Correct)
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator      # re-checked independently, not by trusting the elicitor's own pass/fail claim
    - gr-L3-consistency-checker
    - gr-L2-tool-permissions
    - gr-L3-agent-rate-limit
  tools:
    - tool-L0-github-reader-using-PAT    # reads the evaluation file and the KB; tool-L0-github-reader-using-app takes the same parameters if that variant is deployed instead
    # read-only — all corrections live in the JSON output; nothing is written to GitHub or blob storage

quality:
  evaluation_ref: "evaluation.md"   # THIS evaluator's own meta-quality bar, not the elicitor's rubric
  min_score: 8.0   # evaluators are held to a higher bar than generators — a wrong finding is worse than a wrong requirement
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
