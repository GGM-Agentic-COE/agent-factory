# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-prd-composer
  version: "1.0.0"
  layer: L0
  phase: requirements
  owner: agentic-ai-coe
  created: "2026-10-26"

purpose:
  description: "Composes the evaluated functional requirements and evaluated NFR set into one Product Requirements Document, with zero requirements or boundary conditions dropped, and passes it in memory to its evaluator."
  input: "Evaluated requirements from L0-requirements-elicitor-evaluator, the evaluated NFR set from L0-nfr-classifier-evaluator, the human-supplied product_name, and an optional Confluence link to the vision document."
  output: "{product_name}-prd.md in full in artifacts[0].content, plus items restating requirements[] and compound_splits[] in full and condensed (<=150 char) summaries of the executive summary, assumptions, constraints, risks, and open questions."
  business_value: "Requirements and NFRs in separate JSON outputs aren't a document a team can review or approve. The PRD is the Phase 1 artifact of record that the planning agents read as their single source of truth, so nothing may be lost or re-interpreted in composing it."

prompt:
  ref: "agents/L0-prd-composer/L0-prd-composer-prompt.md"
  version: "1.0.0"
  description: "Fills the embedded PRD template (S4): carries every FR and NFR row verbatim, tags MVP status with a traceable basis, builds Assumptions/Constraints/Risks tables with IDs, rolls TBDs into Open Questions, and writes the executive summary last."

contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"

  input:
    accepts_from_agents: [L0-requirements-elicitor-evaluator, L0-nfr-classifier-evaluator]   # always the EVALUATED outputs, never the raw core-agent outputs
    accepts_direct_input: false
    accepts_file_upload:
      enabled: false
    required_parameters:
      requirements_output: { type: object, description: "L0-requirements-elicitor-evaluator's JSON output (functional_requirements[], compound_splits[]); status must be success" }
      nfr_spec_output: { type: object, description: "L0-nfr-classifier-evaluator's JSON output (nfr_classifications[]); status must be success" }
      product_name: { type: string, description: "Human-supplied product name; every vision reference in the PRD is written as {product_name}-vision.md" }
    optional_parameters:
      OPTIONAL_vision_doc_confluence_link: { type: string, default: "link NA", description: "Confluence link to the vision document, shown in the PRD legend" }

  output:
    $ref: "output_schema.json"   # content.type: "prd" with items + artifacts[0].content — schema file not yet created

context:
  knowledge_bases: []   # PRD template is embedded in the prompt (S4); both upstream outputs are consumed in full
  guardrails:
    - gr-L0-output-schema-validator
    - gr-L0-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker   # zero-drop reconciliation of FRs and NFR boundary conditions
  tools: []   # no tool access — the PRD is passed in memory; publishing to Confluence is L0-prd-composer-evaluator's job

quality:
  evaluation_ref: "evaluation.md"   # generator rubric loaded by L0-prd-composer-evaluator (S6) — not yet present in this folder
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
