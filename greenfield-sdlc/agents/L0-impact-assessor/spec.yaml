spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-impact-assessor
  version: "1.0.0"
  layer: L0
  phase: planning
  owner: agentic-ai-coe
  created: 2026-10-28

purpose:
  description: >
    Assesses PRD requirements against the enterprise estate and builds a traversal-verified
    dependency graph from the same findings in one run. Fetches PRD and target architecture
    from Confluence and document template from GitHub; uploads the completed assessment to S3.
  input: >
    PRD from Confluence ({{confluence-prd-page-id}}),
    target architecture from Confluence ({{confluence-target-architecture-page-id}}),
    document template from GitHub ({{github-impact-assessor-template}}, {{github-repo-name}}, {{github-branch-name}}).
  output: >
    AgentOutput (content.type: impact_assesment) with impact_assessment + dependency_graph items
    and <product_name>-impact-assessment.md uploaded to S3 under <workflow_execution_id>/.
  business_value: >
    Prevents duplicate builds and wrong build sequencing by grounding every FR in the real estate
    and proving cycle_check / critical_path by traversal before backlog prioritisation.

prompt:
  ref: "prompts/L0-impact-assessor/instructions.md"
  version: "1.0.0"
  description: >
    Two-part prompt: Part 1 impact assessment (capability check, technical impact, FR→component
    mapping, blast radius); Part 2 dependency graph (DFS cycle check, longest-path critical path,
    1:1 mermaid). Template fetched from GitHub; output uploaded to S3.

contract:
  input:
    accepts_from_agents: []
    accepts_direct_input: true
    runtime_variables:
      confluence-prd-page-id:
        type: string
        description: "Confluence page ID of the PRD"
      confluence-target-architecture-page-id:
        type: string
        description: "Confluence page ID of the target architecture"
      github-impact-assessor-template:
        type: string
        description: "GitHub folder location of the impact assessment document template"
      github-repo-name:
        type: string
        description: "GitHub repository name"
      github-branch-name:
        type: string
        description: "GitHub branch name"
  output:
    type: impact_assesment
    schema_ref: "output_schema.json"
    artifacts:
      - name: "<product_name>-impact-assessment.md"
        storage: s3
        folder: "<workflow_execution_id>"

context:
  tools:
    - name: confluence-reader
      usage: "Read-only. Two calls: PRD ({{confluence-prd-page-id}}) and target architecture ({{confluence-target-architecture-page-id}})."
    - name: github-reader
      usage: "Read-only. Fetch document template from {{github-impact-assessor-template}} on {{github-repo-name}}@{{github-branch-name}}."
    - name: s3-writer
      usage: "Write <product_name>-impact-assessment.md to folder_name=<workflow_execution_id>."

quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
