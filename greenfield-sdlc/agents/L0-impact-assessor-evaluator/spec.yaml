spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-impact-assessor-evaluator
  version: "1.0.0"
  layer: L0
  phase: planning
  owner: agentic-ai-coe
  created: 2026-10-28

purpose:
  description: >
    Independently re-derives L0-impact-assessor's impact findings, cycle_check, critical_path
    and mermaid from freshly-fetched source data; fixes mechanically-recoverable gaps, escalates
    ambiguity, and persists the evaluated impact-assessment.md to Confluence.
  input: >
    generator_output (inline JSON from L0-impact-assessor);
    <product_name>-impact-assessment.md from S3 (folder=<workflow_execution_id>);
    PRD from Confluence ({{confluence-prd-page-id}});
    target architecture from Confluence ({{confluence-target-architecture-page-id}});
    evaluation rubric from GitHub ({{github-impact-assessor-evaluation}}, {{github-repo-name}}, {{github-branch-name}}).
  output: >
    AgentOutput (content.type: evaluation_result) with scores, findings, fixes_applied,
    final_decision, and evaluated <product_name>-impact-assessment.md as artifact-001
    with storage.confluence_page_id (literal return from Confluence writer) and blob_storage_location.
  business_value: >
    Sole quality gate before L0-backlog-prioritizer — a wrong impact finding or unproven graph
    becomes a wrong build sequence; this agent proves or corrects it before anything is
    topologically sorted.

prompt:
  ref: "prompts/L0-impact-assessor-evaluator/instructions.md"
  version: "1.0.0"
  description: >
    Re-derives capability/technical-impact checks, DFS cycle_check, longest-path critical_path
    and mermaid 1:1; fixes or escalates; unconditional Confluence write of the evaluated document.

contract:
  input:
    accepts_from_agents: [L0-impact-assessor]
    accepts_direct_input: false
    required_parameters:
      generator_output:
        type: object
        description: "AgentOutput from L0-impact-assessor; workflow_execution_id is inherited from this field."
    runtime_variables:
      confluence-prd-page-id:
        type: string
        description: "Confluence page ID of the PRD (fetched independently)"
      confluence-target-architecture-page-id:
        type: string
        description: "Confluence page ID of the target architecture (fetched independently)"
      confluence-impact-assessment-space-key:
        type: string
        description: "Confluence space key for writing the evaluated impact assessment"
      github-impact-assessor-evaluation:
        type: string
        description: "GitHub folder location of the evaluation rubric (evaluation.md)"
      github-repo-name:
        type: string
        description: "GitHub repository name"
      github-branch-name:
        type: string
        description: "GitHub branch name"
  output:
    type: evaluation_result
    schema_ref: "output_schema.json"
    artifacts:
      - name: "<product_name>-impact-assessment.md"
        storage:
          blob_storage_location: "s3://<bucket>/<workflow_execution_id>/<product_name>-impact-assessment.md"
          confluence_page_id: "<literal return from Confluence writer>"

context:
  tools:
    - name: confluence-reader
      usage: "Read-only. Two calls: PRD ({{confluence-prd-page-id}}) and target architecture ({{confluence-target-architecture-page-id}})."
    - name: s3-reader
      usage: "Read <product_name>-impact-assessment.md from folder_name=<workflow_execution_id>."
    - name: github-reader
      usage: "Read evaluation rubric from {{github-impact-assessor-evaluation}} on {{github-repo-name}}@{{github-branch-name}}."
    - name: confluence-writer
      usage: "Write evaluated impact-assessment.md. title=<product_name> Impact Assessment, space_key={{confluence-impact-assessment-space-key}}."

quality:
  evaluation_ref: "evaluation.md"
  min_score: 8.0
  hallucination_check: true
  consistency_check: true

versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
