purpose:
  description: Convert one approved PRD into grounded business-altitude Jira Epics
    with exact source traceability.
  input: One approved PRD from direct input, file upload, or Confluence, plus Project
    and source_reference_path.
  output: AgentOutput content.type=epics
  business_value: Prevents implementation detail and traceability loss when translating
    approved requirements into Jira Epics.
prompt:
