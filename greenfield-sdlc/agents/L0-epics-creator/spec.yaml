  output_schema: '$ref: schemas/agent-output-schema.json'
  input:
    accepts_from_agents:
    - any
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats:
      - .md
      - .txt
      - .json
    required_parameters:
      workflow_context:
        type: object
        description: Source content and workflow lineage required by the prompt.
    optional_parameters: {}
  output:
    $ref: output_schema.json
