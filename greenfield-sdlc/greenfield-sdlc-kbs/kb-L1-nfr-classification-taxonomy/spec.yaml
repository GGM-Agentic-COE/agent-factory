  review_cadence: annually

purpose:
  description: >
    Domain-agnostic classification method for the six standard NFR
    categories (performance, security, scalability, availability,
    compliance, usability): what question to ask per category and what
    FORM a boundary condition should take. Used by
    L0-requirements-nfr-classifier as the first lookup, regardless of which
    vertical it's deployed into, before checking requirements.md or vision.md
    (including its Regulatory Posture section) for the actual grounded values. This KB never
    supplies a number, threshold, or regulation citation itself — asserting
    one without a grounded source is exactly the fabrication
    nfr-spec.template.md's zero-tolerance rule exists to prevent. Same
    pattern as kb-L0-regulatory-frameworks-index in Phase 0: a small,
    reusable, cross-domain index, not a domain fact set.

content:
  format: markdown
  documents:
    - path: content/nfr-classification-taxonomy.md
      sections: [six-categories, performance, security, scalability, availability, compliance, usability, when-not-applicable, glossary]
  total_tokens_estimate: 1233
  chunking: by-section
  embedding_model: text-embedding-3-small

grounding_rules:
  accessed_by: [L0-requirements-nfr-classifier]
  visibility: "L0 — visible to all layers (L0/L1/L3/L4) per standard visibility rule"

freshness:
  trigger_for_update: "a new NFR category becomes standard practice, or an existing category's classification method changes"
  note: >
    This is a classification METHOD, not a domain fact set — it changes far
    less frequently than kb-L1-{domain}-regulatory or kb-L1-{domain}-market.
    Annual review is sufficient; it does not need quarterly/monthly cadence.
