spec_version: "1.0"
artifact_type: knowledge_base
metadata:
  name: kb-L0-food-domain-api-patterns
  version: "1.0.0"
  layer: L0
  owner: agentic-ai-coe
  content_hash: "sha256:pending"
  last_reviewed: "2026-09-22"
  review_cadence: quarterly

purpose:
  description: >
    Integration patterns specific to the food supply chain / producer
    marketplace domain: the participant model and its trust boundaries, the
    four-kind event taxonomy (lifecycle / evidence / movement /
    notification) and why conflating them is the domain's most common
    modelling error, the flows where async-by-default is genuinely wrong and
    what their degraded mode must be, what regulatory change does to
    contract versioning, the governed pattern for unavoidable file exchange,
    and the duplicate/idempotency/replay rules that evidence records impose.
    This is the swappable domain half of L0-solution-architect: the agent is
    domain-agnostic, this KB is what makes its output domain-aware. States
    patterns and their rationale only — it names no bus, gateway or broker
    product, which belong to the approved platform catalogue.

content:
  format: markdown
  documents:
    - path: content/food-domain-api-patterns.md
      sections: [domain-distinctives, participant-model-trust-boundaries, event-taxonomy, sync-async-decision-table, contract-versioning-regulatory-change, partner-file-integration, duplicate-idempotency-recovery, integration-observability, glossary]
  total_tokens_estimate: 2100
  chunking: by-section
  embedding_model: text-embedding-3-small

consumers:
  agents:
    - L0-solution-architect             # FD3, FD4, FD5, FD7, FD8 for its INT-1..INT-3 sections and PLT-4
    - L0-solution-architect-evaluator   # checks INT-1 styles and degraded modes against FD4
  usage: >
    solution-architect reads FD4 for every synchronous decision and its
    degraded mode in INT-1, including the domain's standing rule that an
    unknown availability, fee or eligibility is a refusal rather than an
    optimistic assumption; FD3 and FD5 for INT-2 / INT-3 versioning and
    event kinds, because the kind (not the name) decides ordering, retention
    and replay policy; FD7 for the INT-3 consumer declarations; FD8 for the
    two domain signals in PLT-4 (evidence-chain completeness, external-party
    contract-version distribution). FD6 is read only when a file-based
    exchange is actually proposed — it is the governed transitional pattern,
    never an approved style. Read from Confluence by page id
    (domain_api_patterns_kb_page_id).

grounding_rules:
  accessed_by: [L0-solution-architect, L0-solution-architect-evaluator]
  visibility: "Domain KB — the food supply chain / producer marketplace domain; not an enterprise-wide standard"
  boundary: >
    Domain patterns only. Enterprise integration rules live in
    kb-L0-enterprise-architecture (EA3, EA4, EA9, EA10, EA11); identity,
    residency and classification rules live in kb-L0-enterprise-security.
    This KB cites both rather than restating them — a rule stated in two
    places drifts in one of them.

freshness:
  trigger_for_update: >
    A new mandatory regulatory field applies to an evidence record, a new
    participant category joins the platform, or a partner integration
    capability shifts (e.g. a distributor segment moves off EDI).
  note: >
    Illustrative content for this reference scenario, not a real
    organisation's or a real regulator's requirements. Replace this file
    wholesale when deploying the framework against a different domain — the
    consuming agent does not change.
