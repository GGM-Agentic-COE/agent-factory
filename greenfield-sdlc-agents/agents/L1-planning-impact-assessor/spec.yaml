# Agent Specification Document
spec_version: "1.0"
artifact_type: agent
metadata:
  name: L0-planning-impact-assessor
  version: "1.0.0"
  layer: L0
  phase: planning
  owner: agentic-ai-coe
  created: 2026-10-28
purpose:
  description: "Assesses PRD components against the enterprise estate (service catalog + CMDB) and builds a traversal-verified dependency graph from the same findings in one run."
  input: "prd_output from L0-requirements-prd-composer, plus raw service_catalog and cmdb_export; kb-L1-architecture-principles read via Confluence (page_id 524091393)."
  output: "AgentOutput (content.type impact_assesment) with impact_assessment + dependency_graph meta-point items and the full <Product name>-impact-assessment.md inlined in artifacts[0].content."
  business_value: "Prevents duplicate builds and wrong build sequencing by grounding every FR in the real estate and proving cycle_check / critical_path by traversal before backlog prioritisation."
prompt:
  ref: "prompts/L0-planning-impact-assessor/instructions.md"
  version: "1.0.0"
  description: "Two-part prompt: Part 1 impact assessment against catalog/CMDB/KB; Part 2 dependency graph (DFS cycle check, longest-path critical path, 1:1 mermaid) built from Part 1, inlined as artifact."
contract:
  input_schema: "$ref: schemas/agent-input-contract-schema.json"
  output_schema: "$ref: schemas/agent-output-schema.json"
  input:
    accepts_from_agents: [L0-requirements-prd-composer]
    accepts_direct_input: true
    accepts_file_upload:
      enabled: true
      formats: [".json", ".md"]
    required_parameters:
      prd_output: {type: object, description: "AgentOutput from L0-requirements-prd-composer; status must be success; content.items holds FR-NNN and constraints"}
      service_catalog: {type: object, description: "Service catalog export; services[] (may be empty)"}
      cmdb_export: {type: object, description: "CMDB export; configuration_items[], relationships[], export_metadata.exported_at (may be empty)"}
    optional_parameters:
      run_date: {type: string, default: "execution date (UTC)", description: "Reference date for export staleness check"}
      kb_page_id: {type: string, default: "524091393", description: "Confluence page id of kb-L1-architecture-principles"}
  output:
    $ref: "output_schema.json"
context:
  knowledge_bases:
    - kb-L1-architecture-principles   # fetched at runtime via tool-L1-confluence-fetch-page (page_id 524091393)
  guardrails:
    - gr-L1-output-schema-validator
    - gr-L1-pii-detection
    - gr-L3-hallucination-detector
    - gr-L3-citation-validator
    - gr-L3-consistency-checker
    - gr-L2-tool-permissions
    - gr-L3-agent-rate-limit
  tools:
    - tool-L1-confluence-fetch-page   # read-only; KB + input page retrieval. No write tool — blob persistence is owned by the paired evaluator.
quality:
  evaluation_ref: "evaluation.md"
  min_score: 7.0
  hallucination_check: true
  consistency_check: true
versioning:
  input_version: "1.0"
  output_version: "1.0"
  instruction_hash: "sha256:pending"
